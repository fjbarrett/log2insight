[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "log2insight"
version = "0.1.0"
description = "Local, privacy-first 'Screen Time for everything' tracker for macOS."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # the collection daemon is standard library only

[project.optional-dependencies]
# GUI menu bar app. Kept out of the core so the daemon stays dependency-free.
menubar = [
    "rumps>=0.4",
    "pyobjc-framework-WebKit>=10",  # pulls in pyobjc Cocoa/AppKit too
]

[project.scripts]
log2insight = "log2insight.cli:main"

[tool.setuptools]
packages = ["log2insight", "log2insight.collectors"]
